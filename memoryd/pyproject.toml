[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-memoryd"
version = "0.1.0"
description = "Lore memory sidecar: FastAPI wrapper around mem0 (mem0 arrives with spec 002)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["lore_memoryd*"]

[tool.setuptools.package-data]
lore_memoryd = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Broad-but-practical ruleset: pycodestyle, pyflakes, isort, bugbear,
# comprehensions, pyupgrade, naming, simplify.
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["lore_memoryd", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
