name: CI

# The constitution's gates, enforced by machine on every PR to the default
# branch (and on pushes to it). Four required job groups: C# on Windows,
# Python + app + secret-scan on Linux.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  csharp:
    name: csharp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Lore.sln
      - name: Format (verify, no changes)
        run: dotnet format Lore.sln --verify-no-changes --no-restore
      - name: Build (analyzers as errors)
        run: dotnet build Lore.sln --no-restore -warnaserror
      - name: Test
        run: dotnet test Lore.sln --no-build --verbosity normal

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memoryd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: memoryd/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format (check)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest
        run: pytest

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier (check)
        run: npm run format:check
      - name: TypeScript (no emit)
        run: npm run typecheck
      - name: Build
        run: npm run build

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          TARBALL=gitleaks_8.30.1_linux_x64.tar.gz
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSL "$BASE/$TARBALL" -o "$TARBALL"
          curl -sSL "$BASE/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          grep "$TARBALL" checksums.txt | sha256sum -c -
          tar -xz -f "$TARBALL" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (tree + history)
        run: gitleaks detect --redact --no-banner --verbose
