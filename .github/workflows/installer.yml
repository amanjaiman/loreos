name: installer

# Builds the one signed Windows installer from pinned inputs (spec 011 T002).
# Not part of the per-PR gates (that's ci.yml) — this is heavier (publishes the
# self-contained agent, freezes memoryd with PyInstaller, runs electron-forge make),
# so it runs on demand and on release tags. Acceptance criterion 1, build half.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    name: installer
    runs-on: windows-latest
    # Surface the signing-cert secret as a job-level env var so the "Stage signing
    # certificate" step can gate on its presence. The `secrets` context is NOT allowed in
    # an `if:` condition — referencing it there makes the whole workflow fail to compile
    # (a "workflow file issue" that fails every run at startup) — but `env` is allowed.
    # Empty when the secret is unset → an unsigned but otherwise identical installer.
    env:
      LORE_SIGN_CERT_BASE64: ${{ secrets.LORE_SIGN_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchains: dotnet from global.json, Python 3.11 (matches the spike),
      # Node 20. PyInstaller + electron-forge versions are pinned downstream
      # (build-memoryd.ps1 / package-lock.json), so the build is reproducible.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Optional code-signing: decode the PFX secret to a temp file and point the
      # build at it. With the secret unset these are empty and the build produces an
      # unsigned—but otherwise identical—installer (spec 011 T002 decision).
      - name: Stage signing certificate
        if: ${{ env.LORE_SIGN_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "lore-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LORE_SIGN_CERT_BASE64))
          "LORE_SIGN_CERT_FILE=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        env:
          LORE_SIGN_CERT_PASSWORD: ${{ secrets.LORE_SIGN_CERT_PASSWORD }}
          LORE_SIGN_TIMESTAMP_URL: ${{ vars.LORE_SIGN_TIMESTAMP_URL }}
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lore-installer
          path: |
            app/out/make/**/*.exe
            app/out/make/**/*.nupkg
            app/out/make/**/RELEASES
          if-no-files-found: error
