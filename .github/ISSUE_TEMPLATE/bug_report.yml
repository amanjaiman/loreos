name: Bug report
description: Something in Lore behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not file security vulnerabilities here** —
        see [SECURITY.md](../../SECURITY.md) for private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release or commit SHA you are running.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, and which component (agent, cli, memoryd, app).
    validations:
      required: false
