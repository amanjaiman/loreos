ShortDescription: The open-source ambient capture agent for your personal memory layer.
Description: |-
  Lore watches what you do on your machine — locally, auditably, with aggressive
  filtering — distills what matters with a model you control, stores it in mem0, and
  serves it to every AI tool you use through MCP, a CLI, an agent skill, and a REST
  API. No account, no telemetry, no Lore-operated server: your models, your keys,
  your disk, your memory. Updates flow through winget; Lore itself never checks for
  updates, preserving its zero-egress posture.

